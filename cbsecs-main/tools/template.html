<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Class 11 &amp; 12 Computer Science</title>
<style>
/* Layout: an index of deck cards; opening one lays a full-screen viewer (slides, scroll or grid) over it.
   Colour: the decks' own navy, blue and yellow, with a cool-tinted neutral stage. Type: Caladea/Carlito/Liberation Mono = metric twins of Cambria/Calibri/Courier New. */
/*__FONTS__*/
:root{
  --DeckSans:'DeckSans','Calibri','Carlito','Segoe UI',Arial,sans-serif;
  --DeckSerif:'DeckSerif','Cambria','Caladea',Georgia,serif;
  --DeckMono:'DeckMono','Courier New','Liberation Mono',monospace;
  --bg:#F2F5FA; --surface:#FFFFFF; --fg:#1B2A4E; --muted:#56657F; --line:#D3DBE8;
  --accent:#306998; --accent-ink:#FFFFFF; --stage:#DFE5EF; --hl:#FFD43B; --hl-ink:#1B2A4E; --shadow:rgba(27,42,78,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1324; --surface:#161F36; --fg:#E7ECF6; --muted:#9BA9C4; --line:#28344F;
  --accent:#86B7E8; --accent-ink:#0D1324; --stage:#090E1B; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1324; --surface:#161F36; --fg:#E7ECF6; --muted:#9BA9C4; --line:#28344F;
  --accent:#86B7E8; --accent-ink:#0D1324; --stage:#090E1B; --shadow:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--DeckSans);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- index ---------- */
.home{max-width:1180px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home h1{font-family:var(--DeckSerif);font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 8px;text-wrap:balance}
.site-foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center}
.site-foot b{color:var(--fg)}
.home .lede{margin:0;color:var(--muted);max-width:60ch}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:28px 0 8px}
.tools input{flex:1 1 240px;min-width:0;max-width:420px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tools .count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.grp{margin-top:36px}
.grp h2{font-family:var(--DeckSerif);font-size:22px;margin:0 0 14px;display:flex;gap:10px;align-items:baseline}
.grp h2 span{font-family:var(--DeckSans);font-size:14px;color:var(--muted);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:inherit;text-decoration:none;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 8px 22px var(--shadow);transform:translateY(-2px)}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--stage)}
.thumb .cv{pointer-events:none}
.card .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.card b{font-family:var(--DeckSerif);font-size:18px;line-height:1.2}
.card small{color:var(--muted);font-size:14px;line-height:1.35}
.card .n{margin-top:6px;font-size:13px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.none{color:var(--muted);margin-top:40px}

/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.bar h2{flex:1;min-width:0;margin:0;font-family:var(--DeckSerif);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-decoration:none;color:var(--fg)}
.ib:hover{border-color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{height:38px;padding:0 12px;border:0;background:var(--surface);cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.main{flex:1;min-height:0;position:relative;background:var(--stage);overflow:auto}
.main.m-slides{display:flex;align-items:center;justify-content:center;overflow:hidden}
.main.m-scroll{padding:18px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;align-items:center;gap:18px}
.main.m-grid{padding:18px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start}
.sl{position:relative;flex:none;overflow:hidden;background:#fff;box-shadow:0 4px 18px var(--shadow)}
.m-grid .sl{cursor:pointer}
.m-grid .sl::after{content:attr(data-n);position:absolute;left:0;bottom:0;padding:2px 8px;background:rgba(27,42,78,.85);color:#fff;font:700 12px var(--DeckSans);font-variant-numeric:tabular-nums}
.m-grid .sl:hover{outline:3px solid var(--accent)}
.cv{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden;transform-origin:0 0;font-family:var(--DeckSans);color:#000}
.cv .s{position:absolute;box-sizing:border-box;margin:0}
.cv p{margin:0;white-space:pre-wrap;overflow-wrap:break-word}
.cv img.s{max-width:none}
.cv table.s{border-collapse:collapse;table-layout:fixed}
.cv td{overflow:hidden;box-sizing:border-box}
.m-grid .cv,.m-grid .cv *{user-select:none;pointer-events:none}
.foot{display:flex;align-items:center;gap:12px;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.foot input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.foot .pos{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:24px;text-align:center}
@media (max-width:640px){.seg button{padding:0 9px}.hint,.fs{display:none}.bar h2{font-size:16px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>

<div class="home" id="home">
  <h1>Class 11 &amp; 12 Computer Science</h1>
  <p class="lede" id="lede"></p>
  <div class="tools">
    <input id="q" type="search" placeholder="Search decks, e.g. join, tuple, router" aria-label="Search decks" autocomplete="off">
    <span class="count" id="count"></span>
  </div>
  <div id="groups"></div>
  <footer class="site-foot">Created By <b>Sudheer Singh</b>, PGT Computer Science</footer>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="bar">
    <a class="ib" href="#" id="back" aria-label="Back to all decks"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="hint" style="color:inherit;font-size:14px">All decks</span></a>
    <h2 id="vt"></h2>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-mode="slides" aria-pressed="true">Slides</button>
      <button type="button" data-mode="scroll" aria-pressed="false">Scroll</button>
      <button type="button" data-mode="grid" aria-pressed="false">Grid</button>
    </div>
    <button type="button" class="ib fs" id="fs" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="main m-slides" id="main"></div>
  <div class="foot" id="foot">
    <button type="button" class="ib" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <input type="range" id="scrub" min="1" max="1" value="1" aria-label="Slide number">
    <span class="pos" id="pos">1 / 1</span>
    <button type="button" class="ib" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="hint">← → keys</span>
  </div>
</div>

<script>
const DECKS = /*__DECKS__*/[];
const $ = (s) => document.querySelector(s);
const main = $('#main'), viewer = $('#viewer'), home = $('#home');
let cur = null, mode = 'slides', idx = 1, secs = [], gen = 0;
const cache = new Map();
try { const m = localStorage.getItem('deckMode'); if (m === 'scroll' || m === 'grid' || m === 'slides') mode = m; } catch (e) {}

/* ---------- index ---------- */
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderHome(filter){
  const f = (filter || '').trim().toLowerCase();
  const groups = [];
  DECKS.forEach(d => {
    if (f && !(d.title + ' ' + d.blurb + ' ' + d.group).toLowerCase().includes(f)) return;
    let g = groups.find(x => x.name === d.group);
    if (!g) groups.push(g = { name: d.group, items: [] });
    g.items.push(d);
  });
  const shown = groups.reduce((a, g) => a + g.items.length, 0);
  $('#count').textContent = shown + ' of ' + DECKS.length + ' decks';
  $('#groups').innerHTML = groups.length ? groups.map(g =>
    '<section class="grp"><h2>' + esc(g.name) + '<span>' + g.items.length + (g.items.length === 1 ? ' deck' : ' decks') + '</span></h2><div class="cards">' +
    g.items.map(d => '<a class="card" href="#' + d.slug + '"><div class="thumb" aria-hidden="true">' + d.cover + '</div><div class="tx"><b>' + esc(d.title) + '</b><small>' + esc(d.blurb) + '</small><span class="n">' + d.slides + ' slides</span></div></a>').join('') +
    '</div></section>').join('') : '<p class="none">No deck matches that search.</p>';
  scaleThumbs();
}
function scaleThumbs(){ document.querySelectorAll('.thumb').forEach(t => { const k = t.clientWidth / 1280; if (k) t.firstElementChild.style.transform = 'scale(' + k + ')'; }); }
window.addEventListener('resize', scaleThumbs);
$('#q').addEventListener('input', e => renderHome(e.target.value));
$('#lede').textContent = DECKS.length + ' decks, ' + DECKS.reduce((a, d) => a + d.slides, 0) + ' slides. Pick a deck, then use the arrow keys, scroll through it, or open the grid.';

/* ---------- viewer ---------- */
// Decks are loaded as <script> files (decks/<slug>.js) rather than with fetch(),
// so the site also works when index.html is opened straight from a folder (file://).
window.__DECK_HTML = window.__DECK_HTML || {};
function loadDeck(slug){
  if (cache.has(slug)) return Promise.resolve(cache.get(slug));
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'decks/' + slug + '.js';
    s.onload = () => { const t = window.__DECK_HTML[slug]; if (t) { cache.set(slug, t); resolve(t); } else reject(new Error('empty deck')); };
    s.onerror = () => reject(new Error('could not load ' + s.src));
    document.head.appendChild(s);
  });
}
function setHash(h){ const want = '#' + h; if (location.hash !== want) { skipHash = true; location.replace(want); } }
let skipHash = false;
function parseHash(){
  const h = location.hash.slice(1); if (!h) return null;
  const m = h.match(/^(.+)-s(\d+)$/); const slug = m ? m[1] : h;
  const d = DECKS.find(x => x.slug === slug); return d ? { d, n: m ? +m[2] : 1 } : null;
}
async function openDeck(d, n){
  viewer.hidden = false; document.body.style.overflow = 'hidden';
  if (cur !== d) {
    cur = d; const my = ++gen; $('#vt').textContent = d.title; secs = [];
    main.innerHTML = '<div class="msg">Loading slides…</div>'; document.title = d.title + ' · Class 11 & 12 Computer Science';
    try {
      const html = await loadDeck(d.slug); if (my !== gen) return;
      main.innerHTML = html; secs = [...main.querySelectorAll('section.sl')];
    } catch (e) { main.innerHTML = '<div class="msg">These slides could not be loaded. Check your connection and reopen the deck.</div>'; return; }
    $('#scrub').max = secs.length;
  }
  applyMode(); go(n);
}
function closeViewer(){
  viewer.hidden = true; document.body.style.overflow = ''; cur = null; gen++; secs = []; document.title = 'Class 11 & 12 Computer Science';
  if (document.fullscreenElement) try { document.exitFullscreen(); } catch (e) {}
}
function go(n){
  if (!secs.length) return;
  idx = Math.max(1, Math.min(secs.length, n));
  secs.forEach((s, i) => { s.hidden = (mode === 'slides' && i !== idx - 1); });
  $('#pos').textContent = idx + ' / ' + secs.length; $('#scrub').value = idx;
  $('#prev').disabled = idx <= 1; $('#next').disabled = idx >= secs.length;
  setHash(cur.slug + (idx > 1 || mode === 'slides' ? '-s' + idx : ''));
  layout();
}
function applyMode(){
  main.className = 'main m-' + mode;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  $('#foot').style.display = mode === 'slides' ? '' : 'none';
  secs.forEach(s => { if (mode === 'grid') s.setAttribute('tabindex', '0'); else s.removeAttribute('tabindex'); });
}
function layout(){
  if (!secs.length) return;
  const W = main.clientWidth, H = main.clientHeight; let w;
  if (mode === 'slides') { const pad = W < 700 ? 8 : 20; w = Math.min((W - 2 * pad), (H - 2 * pad) * 16 / 9); }
  else if (mode === 'scroll') { w = Math.min(W - 32, 1180); }
  else { const gap = 14, avail = W - 32, cols = Math.max(1, Math.floor((avail + gap) / (250 + gap))); w = (avail - gap * (cols - 1)) / cols; }
  w = Math.max(120, Math.floor(w)); const h = Math.round(w * 9 / 16), k = w / 1280;
  secs.forEach(s => { s.style.width = w + 'px'; s.style.height = h + 'px'; s.firstElementChild.style.transform = 'scale(' + k + ')'; });
}
function setMode(m){
  mode = m; try { localStorage.setItem('deckMode', m); } catch (e) {}
  applyMode(); go(idx);
  if (m === 'scroll' && secs[idx - 1]) secs[idx - 1].scrollIntoView({ block: 'start' });
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#prev').addEventListener('click', () => go(idx - 1));
$('#next').addEventListener('click', () => go(idx + 1));
$('#scrub').addEventListener('input', e => go(+e.target.value));
$('#back').addEventListener('click', e => { e.preventDefault(); if (location.hash) { skipHash = true; location.hash = ''; } closeViewer(); });
$('#fs').addEventListener('click', () => { try { if (document.fullscreenElement) document.exitFullscreen(); else viewer.requestFullscreen().catch(() => {}); } catch (e) {} });
main.addEventListener('click', e => { if (mode !== 'grid') return; const s = e.target.closest('section.sl'); if (s) { mode = 'slides'; applyMode(); go(+s.dataset.n); } });
main.addEventListener('keydown', e => { if (mode === 'grid' && e.key === 'Enter') { const s = e.target.closest('section.sl'); if (s) { mode = 'slides'; applyMode(); go(+s.dataset.n); } } });
document.addEventListener('keydown', e => {
  if (viewer.hidden || e.target.matches('input[type=search]') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (mode === 'slides' && (k === 'ArrowRight' || k === 'PageDown' || k === ' ')) { e.preventDefault(); go(idx + 1); }
  else if (mode === 'slides' && (k === 'ArrowLeft' || k === 'PageUp')) { e.preventDefault(); go(idx - 1); }
  else if (mode === 'slides' && k === 'Home') { e.preventDefault(); go(1); }
  else if (mode === 'slides' && k === 'End') { e.preventDefault(); go(secs.length); }
  else if (k === 'g' || k === 'G') setMode('grid');
  else if (k === 's' || k === 'S') setMode('slides');
  else if (k === 'f' || k === 'F') $('#fs').click();
  else if (k === 'Escape' && mode === 'grid') setMode('slides');
});
let tx = null;
main.addEventListener('touchstart', e => { tx = mode === 'slides' && e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
main.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 60) go(idx + (dx < 0 ? 1 : -1)); }, { passive: true });
new ResizeObserver(() => layout()).observe(main);
window.addEventListener('hashchange', () => { if (skipHash) { skipHash = false; return; } route(); });
function route(){ const p = parseHash(); if (!p) { closeViewer(); return; } openDeck(p.d, p.n); }
renderHome(''); route();
</script>
</body>
</html>
